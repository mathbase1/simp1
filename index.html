<script>(function (root) {
  'use strict';
  const MAX_LENGTH=240, MAX_TERMS=128, MAX_DEGREE=12;
  function fail(message){throw new Error(message);}
  function gcd(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b){const t=a%b;a=b;b=t;}return a||1n;}
  function rat(n,d=1n){if(d===0n)fail('A denominator cannot be zero.');if(d<0n){n=-n;d=-d;}const g=gcd(n,d);return {n:n/g,d:d/g};}

  const mulR=(a,b)=>rat(a.n*b.n,a.d*b.d);
  const negR=a=>({n:-a.n,d:a.d});
  const isZero=a=>a.n===0n;

  function numberRat(raw){const [a,b='']=raw.split('.');return rat(BigInt((a||'0')+b),10n**BigInt(b.length));}
  function normalize(source){
    if(typeof source!=='string')fail('Type an expression first.');

    }

const glossary=[
{word:'Expression',definition:'A mathematical phrase made from numbers, letters and operations. It has no equals sign.',example:'4x + 7',note:'Simplifying changes how it is written, while keeping the same value.'},
{word:'Variable',definition:'A letter that stands for a number. Its value can change or may not be known yet.',example:'x',note:'In a cost model, x might stand for the price of one pack.'},

function welcome(){const saved=!!state;const voc=state?.vocation||Bank.vocations[0].id;return '<main id="main" class="workspace"><div class="breadcrumb"><span>GCSE Mathematics</span><span class="dot"></span><span>Foundation</span><span class="dot"></span><span>Simplifying expressions</span></div>'+alerts()+'<section class="welcome-grid"><div class="welcome-copy"><p class="eyebrow">Small steps. Stronger algebra.</p><h1>Make every<br><em>term count.</em></h1><p class="lead">Practise algebra in your vocational area. Understand the language, collect like terms and build up to brackets — with a next question chosen from your answers.</p><div class="welcome-chips"><span class="small-chip">No timer</span><span class="small-chip">Hints when you need them</span><span class="small-chip">Your own route</span></div></div><div class="launch-card"><h2>'+ (saved?'Ready to carry on?':'Choose your workshop')+'</h2><p>'+(saved?'Your practice is saved on this browser. Carry on where you stopped, or start a fresh learner.':'Choose your course. The questions will use situations from that area.')+'</p><label class="field-label" for="course-select">Your vocational area</label><select id="course-select">'+options(voc)+'</select><button class="button primary full" data-action="start">'+(saved?'Continue practice':'Start practice')+icon('arrow')+'</button><p class="fineprint">'+(saved?history().length+' checks completed · Progress stays with you. Course changes apply to the next new question.':'Start with short questions. The demand increases when you show that you are ready.')+'</p>'+(saved?'<button class="hint-button" data-action="reset">Start a fresh learner</button>':'')+'</div></section><section class="example-strip" aria-label="What you will practise"><div class="example-cell"><span class="example-index">01 / UNDERSTAND</span><h3>Know what the parts mean</h3><div class="example-math">4<span style="color:var(--teal)">x</span> + 7</div><p>Terms, coefficients, constants and like terms.</p> function showProgress(){const hs=history();const ss=state?.skills||{};panel('Your practice so far','<p class="panel-sub">Your route is based on separate skills, the help you use and the mistakes you work through. These are practice indicators, not exam grades.</p><div class="progress-numbers"><div class="progress-number"><strong>'+hs.length+'</strong><span>checks completed</span></div><div class="progress-number"><strong>'+independentCount()+'</strong><span>correct unaided</span></div><div class="progress-number"><strong>'+hs.filter(supportedEntry).length+'</strong><span>with a hint or word bank</span></div></div><h3>Skills you have practised</h3>'+WorkshopConfig.skills.map(s=>{const evidence=hs.filter(h=>(h.skill||h.question?.skill)===s.id);const unaided=evidence.filter(h=>correctEntry(h)&&!supportedEntry(h)).length;const sk=ss[s.id]||{};const secure=sk.secure===true||sk.mastered===true;return '<div class="progress-row"><strong>'+esc(s.title)+'</strong><span class="status-pill '+(secure?'secure':'')+'">'+(secure?'Secure in this practice':evidence.length?'Building evidence':'To come')+'</span><span class="progress-detail">'+(evidence.length?unaided+' unaided successes in '+evidence.length+' checks':'Introduced after its starting skills')+'</span></div>';}).join('')+(hs.length?'<h3>Recent learning</h3>'+hs.slice(-8).reverse().map((h,i)=>{const q=h.question||{};const ok=correctEntry(h);return '<div class="log-entry"><h4>'+esc(skillName(h.skill||q.skill))+' · '+(ok?(supportedEntry(h)?'correct with support':'correct unaided'):'revisit')+'</h4>'+(q.expression?'<p>'+math(q.expression)+'</p>':'')+'<p>'+rich(h.message||(typeof h.feedback==='string'?h.feedback:h.feedback?.message)||q.rule||'Your next question responds to this check.')+'</p></div>';}).join(''):'<p class="empty-note">Complete a question to start building your progress record.</p>')+'<div class="panel-actions"><button class="button secondary" data-action="csv">'+icon('download',16)+'Results CSV</button><button class="button secondary" data-action="backup">Save progress backup</button><button class="button secondary" data-action="import">Restore backup</button><button class="button secondary" data-action="print">Print summary</button></div><div class="panel-actions"><button class="hint-button" data-action="change-course">Change vocational area</button><button class="hint-button" data-action="reset">Start a fresh learner</button></div><p class="fineprint">Progress is saved in this browser when storage is available. No name is needed. On a shared device, start a fresh learner between students.</p>');}
function showTeacher(){panel('Teacher notes & Foundation scope','<h3>What this activity covers</h3><p>Original vocational questions aligned to Eduqas GCSE Mathematics Foundation: notation and vocabulary (FA1, FA3), collecting terms and expanding brackets (FA4), and reasoning about equivalent expressions (FA6).</p><p>The route begins with terms, coefficients and constants, then distinguishes like terms, collects them, handles signs, multiplies terms, expands a single bracket, expands and collects combined expressions, and finally expands two linear brackets.</p><p>Two-bracket expansion is Foundation content. This activity uses integer coefficients and simple positive integer powers. It is a focused practice activity; it does not cover every part of Foundation algebra, such as surds, factorising or solving equations.</p><h3>How the route adapts</h3><ul><li>Each skill has its own evidence and prerequisites. Successful unaided answers increase the demand within that skill.</li><li>An incorrect or unfinished answer leads to fresh practice of the same skill. Where available, it targets the diagnosed misconception.</li><li>Repeated difficulty reduces demand. A successful recovery leads back into a more demanding check.</li><li>Hints and definitions help learning but do not count as independent mastery.</li><li>Previously difficult skills return for a spaced review. Mathematical signatures prevent identical questions being recycled just by changing the vocational wording.</li></ul><p>Changing vocational area keeps the same algebra progression. Starting a fresh learner clears the practice record, so the route begins again.</p><h3>Answer checking</h3><p>Typed answers are compared symbolically. Different term orders, spaces, Unicode minus signs and squared notation are accepted. Equivalent answers that still need collecting or expanding get an explanation of the remaining step. Invalid notation is explained without scoring the question.</p><h3>Sources checked</h3><ul class="source-list"><li><a href="https://www.eduqas.co.uk/media/cosjcbs1/eduqas-gcse-maths-spec-from-2015-e.pdf" target="_blank" rel="noopener">Eduqas GCSE Mathematics specification</a> — Foundation Algebra, printed page 8 (PDF page 11), FA1, FA3, FA4 and FA6.</li><li><a href="https://www.eduqas.co.uk/media/bi4daopb/gcse-maths-guidance-for-teaching.pdf" target="_blank" rel="noopener">Eduqas Guidance for Teaching</a> — Foundation notation and manipulation, pages 12–15.</li></ul><p class="panel-sub">This is an independently created teaching activity, not an official Eduqas product or a collection of verbatim past-paper questions. Alignment checked in November 2026.</p><h3>Using it with students</h3><p>Share the downloaded HTML through your normal learning platform. It opens in a browser and needs no internet connection for practice. The hosted copy may be restricted to the owner. Source links need internet access.</p><p>There is no timer or built-in calculator: the focus is algebra structure with manageable numbers. You can export results and a progress backup from Your progress.</p><div class="panel-actions"><button class="button primary" data-action="download-app">'+icon('download',16)+'Download offline app</button><button class="button secondary" data-action="progress">View progress</button></div>');}
function confirmReset(){panel('Start a fresh learner','<p>This clears the current practice on this browser and starts at the beginning. It does not change any backup you have already downloaded.</p><p class="reset-warning">Use this when a different student is taking over the device. Keep your current progress first if you want to return to it.</p><div class="panel-actions"><button class="button secondary" data-action="backup">Save progress backup</button><button class="button primary" data-action="do-reset">Start fresh</button><button class="button secondary" data-action="close-panel">Cancel</button></div>');}
function download(name,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function backup(){if(!state){toast('Start a practice first to save progress.');return;}download('expression_workshop_progress.json',JSON.stringify({app:'Expression Workshop',exportedAt:new Date().toISOString(),state},null,2),'application/json');toast('Progress backup prepared.');}
function csv(){const rows=[['Check','Vocational area','Skill','Question','Expression','Answer','Outcome','Support','Explanation']];history().forEach((h,i)=>{const q=h.question||{};const cid=q.kind==='choice'?h.response:null;const response=cid?q.options?.find(o=>o.id===cid)?.text||cid:entryResponse(h);rows.push([i+1,vocationName(q.vocation||h.vocation||state.vocation),skillName(h.skill||q.skill),q.prompt||'',q.expression||'',response,correctEntry(h)?'Correct':h.outcome||h.status||'Revisit',supportedEntry(h)?'Supported':'Unaided',h.message||(typeof h.feedback==='string'?h.feedback:h.feedback?.message)||q.rule||'']);});const cell=x=>{let str=String(x??'');if(/^[=+@\t\r]/.test(str))str="'"+str;return '"'+str.replace(/"/g,'""')+'"';};download('expression_workshop_results.csv','\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('Results CSV prepared.');}
function importBackup(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.hidden=true;document.body.append(input);input.addEventListener('cancel',()=>input.remove(),{once:true});input.addEventListener('change',async()=>{const file=input.files[0];input.remove();if(!file)return;if(file.size>12e6){toast('That backup is too large. Choose an Expression Workshop backup.');return;}try{const data=JSON.parse(await file.text());const restored=Adaptive.restore(data.state||data);state=restored;restoreNotice='';view='welcome';selected='';draft='';hinted=false;invalid='';save();$('#panel').close();render();toast('Progress restored. Choose Continue practice.');}catch(e){toast('This is not a valid Expression Workshop backup. Your current progress is unchanged.');}});input.click();}
function closePanel(){const open=$('#panel').open;if(open)$('#panel').close();if(view==='practice'&&state?.current&&!state.currentFeedback&&hinted)render();lastFocus?.focus?.();}
let offlineSource='';
document.addEventListener('click',e=>{const insert=e.target.closest('[data-insert]');if(insert){const input=$('#expression-answer');if(!input||input.disabled)return;const text=insert.dataset.insert;const start=input.selectionStart??input.value.length,end=input.selectionEnd??start;input.setRangeText(text,start,end,'end');draft=input.value;input.focus();return;}const word=e.target.closest('[data-word]');if(word){showWords(word.dataset.word);return;}const btn=e.target.closest('[data-action]');if(!btn)return;switch(btn.dataset.action){case'start':start();break;case'next':newQuestion();break;case'home':view='welcome';save();render();break;case'theme':prefs.theme=prefs.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=prefs.theme;save();render();break;case'large':prefs.large=!prefs.large;document.documentElement.dataset.size=prefs.large?'large':'normal';save();render();break;case'hint':hinted=true;state.currentHinted=true;save();render();break;case'words':showWords();break;case'progress':showProgress();break;case'teacher':showTeacher();break;case'close-panel':closePanel();break;case'change-course':$('#panel').close();view='welcome';render();$('#course-select')?.focus();break;case'reset':confirmReset();break;case'do-reset':state=null;try{localStorage.removeItem(STORE);}catch(e){}view='welcome';selected='';draft='';hinted=false;invalid='';$('#panel').close();render();toast('Ready for a fresh learner.');break;case'backup':backup();break;case'csv':csv();break;case'import':importBackup();break;case'print':window.print();break;case'download-app':download('simplifying_expressions.html',offlineSource,'text/html;charset=utf-8');toast('Offline HTML prepared. Save it, then open it in your browser.');break;}});
$('#panel').addEventListener('click',e=>{if(e.target===$('#panel')){const r=$('#panel').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closePanel();}});
$('#panel').addEventListener('cancel',()=>{if(view==='practice'&&hinted)requestAnimationFrame(()=>render());});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&state?.currentFeedback&&view==='practice'&&!$('#panel').open&&document.activeElement?.id==='feedback'){e.preventDefault();newQuestion();}});
offlineSource='<!doctype html>\n'+document.documentElement.outerHTML;
render();
})();
</script>
</body>
